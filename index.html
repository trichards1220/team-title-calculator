};
const LA_HOMESTEAD_EXEMPTION=75000;
const LA_ASSESSMENT_RATIO=0.10;

function calcPropertyTax(purchasePrice,parish,applyHomestead){
  const data=PARISH_MILLAGE[parish];
  if(!data||!purchasePrice)return null;
  const fmv=parseFloat(purchasePrice);
  const assessedValue=fmv*LA_ASSESSMENT_RATIO;
  if(!applyHomestead){
    const annualTax=(assessedValue/1000)*data.totalMills;
    return{assessedValue,taxableValue:assessedValue,annualTax:Math.round(annualTax*100)/100,monthlyTax:Math.round((annualTax/12)*100)/100,homesteadSavings:0,parish:data.label,millage:data.totalMills};
  }
  const exemptAmount=Math.min(assessedValue,LA_HOMESTEAD_EXEMPTION*LA_ASSESSMENT_RATIO);
  const taxOnExemptPortion=((assessedValue-exemptAmount)/1000)*data.homesteadExemptMills;
  const taxOnNonExemptMills=(assessedValue/1000)*(data.totalMills-data.homesteadExemptMills);
  let annualTax;
  if(assessedValue<=LA_HOMESTEAD_EXEMPTION*LA_ASSESSMENT_RATIO){
    annualTax=(assessedValue/1000)*(data.totalMills-data.homesteadExemptMills);
  }else{
    annualTax=((assessedValue-(LA_HOMESTEAD_EXEMPTION*LA_ASSESSMENT_RATIO))/1000)*data.homesteadExemptMills+(assessedValue/1000)*(data.totalMills-data.homesteadExemptMills);
  }
  const noExemptTax=(assessedValue/1000)*data.totalMills;
  const savings=noExemptTax-annualTax;
  return{assessedValue,taxableValue:assessedValue,annualTax:Math.round(annualTax*100)/100,monthlyTax:Math.round((annualTax/12)*100)/100,homesteadSavings:Math.round(savings*100)/100,parish:data.label,millage:data.totalMills};
}

function laOwner(a){if(a<=0)return 0;const m=Math.ceil(a/1000)*1000;if(m<=12000)return 100;if(m<=50000)return 100+((m-12000)/1000)*5.4;if(m<=100000)return 305.2+((m-50000)/1000)*4.8;if(m<=500000)return 545.2+((m-100000)/1000)*4.5;if(m<=1e6)return 2345.2+((m-500000)/1000)*3.6;if(m<=2e6)return 4145.2+((m-1e6)/1000)*3;return 7145.2+((m-2e6)/1000)*2.7}
function laLender(a){if(a<=0)return 0;const m=Math.ceil(a/1000)*1000;if(m<=12000)return 100;if(m<=50000)return 100+((m-12000)/1000)*4.2;if(m<=100000)return 259.6+((m-50000)/1000)*3.6;if(m<=500000)return 439.6+((m-100000)/1000)*3.3;if(m<=1e6)return 1759.6+((m-500000)/1000)*2.7;if(m<=2e6)return 3109.6+((m-1e6)/1000)*2.4;return 5509.6+((m-2e6)/1000)*2.1}
function msOwner(a){if(a<=0)return 0;return Math.max(a<=1e6?(a/1000)*4:4000+((a-1e6)/1000)*2,150)}
function msLender(a){if(a<=0)return 0;return Math.max(a<=1e6?(a/1000)*3:3000+((a-1e6)/1000)*1.5,150)}
function msSimLender(oa,la){if(la<=oa)return 100;return 100+msLender(la-oa)}
function msRefiLender(a){if(a<=0)return 0;return Math.max(a<=1e6?(a/1000)*2:2000+((a-1e6)/1000)*1,150)}

  const up=(k)=>(e)=>{const v=e.target.value;sF(prev=>({...prev,[k]:v}))};

  const buildQuote=()=>{

    else{ri.push({label:"Recordation of Mortgage/Deed of Trust (est. 25 pgs)",amount:rec.m})}

    city:f.city,
    state:f.stateField,
    zip:f.zip,
    office_name:quote.off.name,
    tx_type:f.txType==="purchase"?"Financed Purchase":f.txType==="cashSale"?"Cash Sale":"Refinance",
    purchase_price:f.purchasePrice?fmt(f.purchasePrice):"N/A",
    loan_amount:f.loanAmount?fmt(f.loanAmount):"N/A",
    closing_date:f.closingDate||"Not specified",
    fees_total:fmt(quote.feesTotal),
    ti_total:fmt(quote.tiTotal),
    rec_total:fmt(quote.recTotal),
    grand_total:fmt(quote.grand),
    user_notes:notes||"None",
  });

  const handleOrder=()=>{
    setSending(true);setSendError("");
    const params=buildEmailParams();
    params.user_notes=(notes||"None")+"\n\nDocuments attached: "+(files.length?[...files].map(x=>x.name).join(", "):"None");
    emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_ORDER_TEMPLATE,params)
      .then(()=>{setSending(false);setOrderSent(true)})
      .catch(err=>{setSending(false);setSendError("Failed to send order. Please call "+quote.off.phone+" directly. ("+err.text+")")});
  };

  const handleDecline=()=>{
    setSending(true);setSendError("");
    const params=buildEmailParams();
    emailjs.send(EMAILJS_SERVICE_ID,EMAILJS_LEAD_TEMPLATE,params)
      .then(()=>{setSending(false);setLeadSent(true)})
      .catch(err=>{setSending(false);setLeadSent(true)});
  };

  /* ── STEP 1 ── */
  if(step===1) return(
    <Wrap step={step}>
      <SecHead num={1}>Your Contact Information</SecHead>
      <div style={cardSt}>
        <div style={row2}>
          <div style={fieldBox}><label style={labelSt}>First Name</label><input style={inputSt} value={f.firstName} onChange={up("firstName")} placeholder="First name"/></div>
          <div style={fieldBox}><label style={labelSt}>Last Name</label><input style={inputSt} value={f.lastName} onChange={up("lastName")} placeholder="Last name"/></div>
        </div>
        <div style={row2}>
          <div style={fieldBox}><label style={labelSt}>Email Address</label><input type="email" style={inputSt} value={f.email} onChange={up("email")} placeholder="your@email.com"/></div>
          <div style={fieldBox}><label style={labelSt}>Phone Number</label><input type="tel" style={inputSt} value={f.phone} onChange={up("phone")} placeholder="(985) 000-0000"/></div>
        </div>
        <div style={fieldBox}>
          <label style={labelSt}>Your Role in This Transaction</label>
          <select style={inputSt} value={f.role} onChange={up("role")}><option value="">Select your role...</option>{ROLES.map(r=><option key={r} value={r}>{r}</option>)}</select>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
          <button style={{...btnP,opacity:canStep2?1:0.45}} disabled={!canStep2} onClick={()=>setStep(2)}>Continue →</button>
        </div>
      </div>
    </Wrap>
  );

  /* ── STEP 2 ── */
  if(step===2) return(
    <Wrap step={step}>
      <SecHead num={2}>Property &amp; Transaction Details</SecHead>
      <div style={cardSt}>
        <div style={fieldBox}><label style={labelSt}>Property Address</label><input style={inputSt} value={f.propertyAddress} onChange={up("propertyAddress")} placeholder="123 Main Street"/></div>
        <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:16}}>
          <div style={fieldBox}><label style={labelSt}>City</label><input style={inputSt} value={f.city} onChange={up("city")} placeholder="City"/></div>
          <div style={fieldBox}><label style={labelSt}>State</label><input style={inputSt} value={f.stateField} onChange={up("stateField")} placeholder="LA"/></div>
          <div style={fieldBox}><label style={labelSt}>ZIP</label><input style={inputSt} value={f.zip} onChange={up("zip")} placeholder="70000"/></div>
        </div>
        <div style={row2}>
          <div style={fieldBox}>
            <label style={labelSt}>Closing Office</label>
            <select style={inputSt} value={f.office} onChange={(e)=>{const v=e.target.value;sF(prev=>({...prev,office:v,txType:""}))}}>
              <option value="">Select office...</option>
              <option value="batonRouge">Baton Rouge, LA</option>
              <option value="mandeville">Mandeville, LA</option>
              <option value="metairie">Metairie, LA</option>
              <option value="brookhaven">Brookhaven, MS</option>
              <option value="mhuMS">Mississippi — MHU (SW Funding)</option>
              <option value="alabama">Alabama — MHU (SW Funding)</option>
            </select>
          </div>
          <div style={fieldBox}>
            <label style={labelSt}>Transaction Type</label>
            <select style={inputSt} value={f.txType} onChange={up("txType")}>
              <option value="">Select type...</option>
              {txOpts().map(t=><option key={t.v} value={t.v}>{t.l}</option>)}
            </select>
          </div>
        </div>
        <div style={row2}>
          {needsPrice&&<div style={fieldBox}><label style={labelSt}>Sale / Purchase Price</label><input type="number" style={inputSt} value={f.purchasePrice} onChange={up("purchasePrice")} placeholder="250000" min="0"/></div>}
          {needsLoan&&<div style={fieldBox}><label style={labelSt}>Loan Amount</label><input type="number" style={inputSt} value={f.loanAmount} onChange={up("loanAmount")} placeholder="200000" min="0"/></div>}
        </div>
        <div style={fieldBox}><label style={labelSt}>Estimated Closing Date (optional)</label><input type="date" style={inputSt} value={f.closingDate} onChange={up("closingDate")}/></div>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:8}}>
          <button style={btnS} onClick={()=>setStep(1)}>← Back</button>
          <button style={{...btnP,opacity:canStep3?1:0.45}} disabled={!canStep3} onClick={buildQuote}>Generate My Estimate →</button>
        </div>
      </div>
    </Wrap>
  );

  /* ── STEP 3 — QUOTE ── */
  if(step===3&&quote) {
    const showPropTax=quote.st==="LA"&&PARISH_MILLAGE[quote.off.parish]&&f.purchasePrice;
    const propTax=showPropTax?calcPropertyTax(f.purchasePrice,quote.off.parish,applyHomestead):null;

    return(
    <Wrap step={step}>
      <SecHead num={3}>Your Closing Cost Estimate</SecHead>
      <div style={cardSt}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,padding:16,background:C.cream,borderRadius:8,fontSize:13,marginBottom:20,fontFamily:"'Segoe UI',sans-serif"}}>
          <div><strong style={{color:C.navy}}>Prepared For:</strong> {f.firstName} {f.lastName}</div>
          <div><strong style={{color:C.navy}}>Role:</strong> {f.role}</div>
          <div><strong style={{color:C.navy}}>Property:</strong> {f.propertyAddress}{f.city?", "+f.city:""}{f.stateField?", "+f.stateField:""} {f.zip}</div>
          <div><strong style={{color:C.navy}}>Office:</strong> {quote.off.name}</div>
          <div><strong style={{color:C.navy}}>Transaction:</strong> {f.txType==="purchase"?"Financed Purchase":f.txType==="cashSale"?"Cash Sale":"Refinance"}</div>
          {f.purchasePrice&&<div><strong style={{color:C.navy}}>Sale Price:</strong> {fmt(f.purchasePrice)}</div>}
          {f.loanAmount&&<div><strong style={{color:C.navy}}>Loan Amount:</strong> {fmt(f.loanAmount)}</div>}
          {f.closingDate&&<div><strong style={{color:C.navy}}>Est. Closing:</strong> {f.closingDate}</div>}
        </div>

        <QSH>Settlement &amp; Title Fees</QSH>
        {quote.fees.map((x,i)=><QL key={i} l={x.label} a={x.amount}/>)}
        <QT l="Settlement & Title Fees Subtotal" a={quote.feesTotal}/>

        <QSH>Title Insurance Premiums</QSH>
        {quote.op>0&&<QL l="ALTA Owner's Title Insurance Premium" a={quote.op}/>}
        {quote.lp>0&&<QL l={"ALTA Lender's Title Insurance Premium"+(quote.simNote?" *":"")} a={quote.lp}/>}
        {quote.cpl>0&&<QL l="Closing Protection Letter Premium" a={quote.cpl}/>}
        {quote.simNote&&<div style={{fontSize:11,color:C.slateLight,fontStyle:"italic",marginTop:2,fontFamily:"'Segoe UI',sans-serif"}}>* {quote.simNote}</div>}
        <QT l="Title Insurance Subtotal" a={quote.tiTotal}/>

        <QSH>Governmental Recording Charges — {quote.recLbl}</QSH>
        {quote.ri.map((x,i)=><QL key={i} l={x.label} a={x.amount}/>)}
        <QT l="Recording Charges Subtotal" a={quote.recTotal}/>

        <div style={{marginTop:28,padding:"18px 24px",background:C.navy,borderRadius:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{color:C.white,fontSize:17,fontWeight:700}}>ESTIMATED TOTAL CLOSING COSTS</span>
          <span style={{color:C.gold,fontSize:26,fontWeight:800,fontFamily:"'Georgia',serif"}}>{fmt(quote.grand)}</span>
        </div>

        <div style={{marginTop:28,padding:18,background:C.amberBg,border:"1px solid "+C.amberBorder,borderRadius:8}}>
          <div style={{fontSize:12,fontWeight:700,color:C.amber,textTransform:"uppercase",letterSpacing:0.8,marginBottom:10,fontFamily:"'Segoe UI',sans-serif"}}>Other Potential Fees If Required or Requested — Not Included in Total Above</div>
          {quote.pot.map((x,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",fontSize:12,color:"#78350F",padding:"4px 0",borderBottom:i<quote.pot.length-1?"1px solid "+C.amberBorder:"none",fontFamily:"'Segoe UI',sans-serif"}}>
              <span>{x.l}</span><span style={{fontWeight:600}}>{fmt(x.a)}</span>
            </div>
          ))}
        </div>

        <div style={{marginTop:20,padding:16,background:C.offWhite,borderRadius:8,fontSize:11,color:C.slateLight,lineHeight:1.7,fontFamily:"'Segoe UI',sans-serif"}}>
          <strong style={{color:C.navy}}>Please Note:</strong>
          {DISCLAIMERS.map((d,i)=><div key={i} style={{marginTop:4}}>• {d}</div>)}
        </div>

        <div style={{display:"flex",gap:12,marginTop:24,flexWrap:"wrap"}} className="no-print">
          <button onClick={()=>window.print()} style={{...btnS,fontSize:13,flex:1,minWidth:140}}>🖨️ Print Estimate</button>
          <button onClick={()=>{setStep(1);setQuote(null);setOrderSent(false);setLeadSent(false);setSendError("")}} style={{...btnS,fontSize:13,flex:1,minWidth:140,borderColor:C.border,color:C.slate}}>← New Estimate</button>
        </div>

        {/* ═══════════════════════════════════════
            PROPERTY TAX ESTIMATOR — Separate Section
            ═══════════════════════════════════════ */}
        {showPropTax&&propTax&&(
          <div style={{marginTop:36}}>
            <div style={{background:C.navyLight,padding:"14px 24px",borderRadius:"8px 8px 0 0",display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:30,height:30,borderRadius:"50%",background:C.gold,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,color:C.white,flexShrink:0}}>🏠</div>
              <span style={{color:C.white,fontSize:16,fontWeight:700,fontStyle:"italic"}}>Estimated Annual Property Taxes — {propTax.parish}</span>
            </div>
            <div style={{background:C.white,border:"1px solid "+C.goldBorder,borderRadius:"0 0 8px 8px",padding:"24px 24px 28px"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,fontFamily:"'Segoe UI',sans-serif"}}>
                <label style={{fontSize:13,color:C.slate,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                  <input type="checkbox" checked={applyHomestead} onChange={e=>setApplyHomestead(e.target.checked)} style={{width:16,height:16,accentColor:C.gold}}/>
                  Apply Louisiana Homestead Exemption ($75,000)
                </label>
              </div>

              <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",fontSize:13,color:C.slate,borderBottom:"1px solid "+C.lightGray,fontFamily:"'Segoe UI',sans-serif"}}>
                <span>Fair Market Value (Purchase Price)</span><span style={{fontWeight:600}}>{fmt(f.purchasePrice)}</span>
              </div>
              <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",fontSize:13,color:C.slate,borderBottom:"1px solid "+C.lightGray,fontFamily:"'Segoe UI',sans-serif"}}>
                <span>Assessed Value (10% of FMV)</span><span style={{fontWeight:600}}>{fmt(propTax.assessedValue)}</span>
              </div>
              {applyHomestead&&<div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",fontSize:13,color:C.green,borderBottom:"1px solid "+C.lightGray,fontFamily:"'Segoe UI',sans-serif"}}>
                <span>Homestead Exemption Savings</span><span style={{fontWeight:600}}>−{fmt(propTax.homesteadSavings)}/yr</span>
              </div>}
              <div style={{display:"flex",justifyContent:"space-between",padding:"6px 0",fontSize:13,color:C.slate,borderBottom:"1px solid "+C.lightGray,fontFamily:"'Segoe UI',sans-serif"}}>
                <span>Total Millage Rate</span><span style={{fontWeight:600}}>{propTax.millage} mills</span>
              </div>

              <div style={{marginTop:16,padding:"14px 20px",background:C.navy,borderRadius:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{color:C.white,fontSize:15,fontWeight:700}}>ESTIMATED ANNUAL PROPERTY TAX</div>
                  <div style={{color:C.goldLight,fontSize:12,marginTop:2}}>Approximately {fmt(propTax.monthlyTax)} / month</div>
                </div>
                <span style={{color:C.gold,fontSize:24,fontWeight:800,fontFamily:"'Georgia',serif"}}>{fmt(propTax.annualTax)}</span>
              </div>

              <div style={{marginTop:12,padding:12,background:C.offWhite,borderRadius:6,fontSize:11,color:C.slateLight,lineHeight:1.6,fontFamily:"'Segoe UI',sans-serif"}}>
                <strong style={{color:C.navy}}>Property Tax Disclaimer:</strong> This estimate is for informational purposes only and is based on approximate millage rates for {propTax.parish}. Actual property taxes are determined by the parish assessor's office and may vary based on the assessed value they assign, special assessments, and any applicable exemptions. Millage rates change annually. Contact the {propTax.parish} Assessor's Office for exact figures.
              </div>
            </div>
          </div>
        )}

        {/* ═══════════════════════════════════════
            ORDER TITLE / DECLINE SECTION
            ═══════════════════════════════════════ */}
        {!orderSent&&!leadSent&&(
          <div style={{marginTop:32,padding:28,background:C.greenLight,border:"2px solid "+C.green,borderRadius:12,textAlign:"center"}} className="no-print">
            <div style={{fontSize:22,fontWeight:700,color:C.green,fontFamily:"'Georgia',serif"}}>Ready to Open Title?</div>
            <div style={{fontSize:13,color:C.slate,marginTop:6,marginBottom:18,fontFamily:"'Segoe UI',sans-serif"}}>Upload your purchase agreement and/or lender's request for title commitment to get started.</div>
            <label style={{display:"block",marginBottom:14,padding:"14px 16px",border:"2px dashed "+C.green,borderRadius:8,cursor:"pointer",fontSize:13,color:C.green,fontFamily:"'Segoe UI',sans-serif"}}>
              📎 Click to Upload Documents
              <input type="file" multiple style={{display:"none"}} onChange={e=>setFiles([...e.target.files])}/>
            </label>
            {files.length>0&&<div style={{fontSize:12,color:C.slate,marginBottom:10,fontFamily:"'Segoe UI',sans-serif"}}>{[...files].map(x=>x.name).join(", ")}</div>}
            <textarea placeholder="Additional notes for your closing team..." value={notes} onChange={e=>setNotes(e.target.value)} style={{width:"100%",padding:12,border:"1px solid "+C.border,borderRadius:6,fontSize:13,minHeight:60,resize:"vertical",boxSizing:"border-box",fontFamily:"'Segoe UI',sans-serif",marginBottom:14}}/>
            {sendError&&<div style={{color:"#DC2626",fontSize:13,marginBottom:10,fontFamily:"'Segoe UI',sans-serif"}}>{sendError}</div>}
            <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap"}}>
              <button onClick={handleOrder} disabled={sending} style={{...btnP,background:sending?"#999":C.green,color:C.white,padding:"14px 40px",fontSize:16,cursor:sending?"wait":"pointer"}}>{sending?"Sending...":"✓ Yes, Order Title"}</button>
              <button onClick={handleDecline} disabled={sending} style={{...btnS,borderColor:C.border,color:C.slate,padding:"14px 32px",cursor:sending?"wait":"pointer"}}>Not Right Now</button>
            </div>
          </div>
        )}

        {orderSent&&(
          <div style={{marginTop:28,padding:24,background:C.greenLight,borderRadius:12,textAlign:"center"}} className="no-print">
            <div style={{fontSize:22,fontWeight:700,color:C.green,fontFamily:"'Georgia',serif"}}>✓ Order Submitted!</div>
            <div style={{fontSize:13,color:C.slate,marginTop:8,fontFamily:"'Segoe UI',sans-serif"}}>Your order has been routed to our <strong>{quote.off.name}</strong> team at <strong>{quote.off.orderEmail}</strong>.</div>
            <div style={{fontSize:13,color:C.slate,marginTop:4,fontFamily:"'Segoe UI',sans-serif"}}>A closing specialist will be in touch within one business day.</div>
            <div style={{fontSize:14,color:C.navy,marginTop:12,fontWeight:600}}>Questions? Call {quote.off.phone}</div>
          </div>
        )}
        {leadSent&&(
          <div style={{marginTop:28,padding:24,background:C.amberBg,borderRadius:12,textAlign:"center"}} className="no-print">
            <div style={{fontSize:20,fontWeight:700,color:C.amber,fontFamily:"'Georgia',serif"}}>Thank You!</div>
            <div style={{fontSize:13,color:C.slate,marginTop:8,fontFamily:"'Segoe UI',sans-serif"}}>We appreciate your interest. A member of the Team Title team may follow up to see how we can assist with your closing needs.</div>
            <div style={{fontSize:14,color:C.navy,marginTop:12,fontWeight:600}}>Questions? Call {quote.off.phone}</div>
          </div>
        )}
      </div>
    </Wrap>
  );}

  return null;
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
